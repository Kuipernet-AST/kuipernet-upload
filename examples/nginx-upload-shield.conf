# Kuipernet Upload: Nginx configuration examples
#
# Place this directive in the main context of nginx.conf.
#   load_module modules/ngx_http_upload_shield_module.so;

# ---------------------------------------------------------------------------
# Example 1. Apply the policy only to specified upload routes.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name files.example.com;

    client_max_body_size 100m;          # Total request body limit enforced by Nginx.

    location /upload/ {
        upload_shield monitor;          # Start with MONITOR. Forward violations and log the result.
        upload_shield_max_file_size 20m;    # Per-file limit, separate from the total body limit.
        upload_shield_max_files     10;
        upload_shield_max_parts     50;
        proxy_pass http://127.0.0.1:8080;   # Example backend: Tomcat. Keep request buffering enabled.
    }

    location /upload/avatar {
        upload_shield block;            # Enable BLOCK after reviewing MONITOR results.
        upload_shield_max_file_size 2m;
        upload_shield_max_files     1;
        upload_shield_max_body_size 3m;     # Set a lower total body limit for this route.
        upload_shield_body_timeout  30s;    # Maximum time to receive the complete body.
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;   # Upload inspection is disabled here.
    }
}

# ---------------------------------------------------------------------------
# Example 2. Apply temporary protection across a virtual host.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name shop.example.com;

    upload_shield                        block;
    upload_shield_deny_session_progress  on;     # Reject the PHP session upload progress field.
    upload_shield_max_parts              100;
    upload_shield_max_part_headers       4;
    upload_shield_max_field_name_size    128;
    upload_shield_max_field_name_depth   4;
    upload_shield_max_files              10;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;    # Keep fastcgi_request_buffering enabled.
    }

    # Reject multipart on routes that do not accept uploads.
    location ~ ^/(api|cart|checkout)/ {
        upload_shield_deny_multipart on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # Allow the progress field only where the application uses it.
    location = /admin/import.php {
        upload_shield_deny_session_progress off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}

# ---------------------------------------------------------------------------
# Example 3. Keep upload limits after applying the PHP security update.
# Keep the limits and disable temporary options as appropriate.
# ---------------------------------------------------------------------------
